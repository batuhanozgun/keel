# bekci.conf — bekçinin PROJE AYARI [SORULUR]. Tek okuyucu: tools/bekci/cekirdek.mjs.
# Biçim: ANAHTAR=değer · satır başında "#" yorumdur · tırnak kullanılmaz (kanal.conf emsali;
# VERİ dosyasıdır, source edilmez). Kurulum bu dosyayı projeye göre doldurur; kurulumdan sonra
# sahip onayıyla değişir (file-guard bu tek dosyayı [SERT] dizinden ayırıp SORULUR'a düşürür).
# Ayarın YAZAMAYACAĞI iki şey (çekirdek reddeder, sözleşme §0): kök şemasının zorunlu kümesi ·
# GENESIS.md'nin izinli kümeye alınması.
kadran=tam
# Tavanlar BAYT'tır (sözleşme §5④); sayılar İLK RETRODA ölçümle yeniden kalibre edilir (F3).
tavan_pano=2048
tavan_saglik=2048
tavan_durum=2048
tavan_kutu=10240
tavan_ertelenenler=4096
tavan_sende_bekleyen=10240
tavan_brifing=2048
tavan_notlar=2048
tavan_el_kitabi=16384
# Ürün kod yolları — K-01 ilan edince doldurulur (ör. Node: 04_urun ya da: server.mjs public).
# Boş bırakılırsa golden-tazelik karşılaştırma tabanı yok der (BİLGİ), kök şeması ürün
# dosyalarını tanımaz.
urun_yollari=
golden_dizini=02_kanon/golden
# Editör/OS artıkları (kök izinli kümesine eklenir; zorunlu kümeye dokunamaz).
kok_izinli_ek=.DS_Store
pano_izinli_ek=.DS_Store
